services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naive-greeks-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: naive-greeks-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
